<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 強制禁止縮放，防止 iOS 雙擊時畫面放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iOS PWA 專屬設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="極速剪貼">
    <title>極速剪貼 PWA</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏滾動條但保持可滾動 */
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; user-select: none; -webkit-user-select: none; }
        
        /* 點擊波紋與過場動畫 */
        .slot-card { transition: all 0.2s ease-in-out; }
        .slot-card:active { transform: scale(0.98); }
        .slot-flash { animation: flash-green 0.5s ease-out; }
        @keyframes flash-green {
            0% { background-color: rgba(34, 197, 94, 0.4); }
            100% { background-color: transparent; }
        }

        /* FAB 展開動畫 */
        .fab-menu { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; opacity: 0; transform: translateY(20px) scale(0.9); }
        .fab-menu.active { pointer-events: auto; opacity: 1; transform: translateY(0) scale(1); }
        
        /* Toast 動畫 */
        .toast { transition: all 0.3s ease; transform: translateY(-100%); opacity: 0; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 頂部導航列 -->
    <header class="pt-12 pb-4 px-6 bg-white dark:bg-gray-800 shadow-sm z-10 shrink-0 flex justify-between items-center relative">
        <!-- 標題區塊 -->
        <div class="flex-1 min-w-0 pr-2" id="header-title-container">
            <!-- 由 JS 渲染 -->
        </div>
        <!-- 動作區塊 -->
        <div class="flex items-center space-x-3 shrink-0" id="header-actions">
            <!-- 由 JS 渲染 -->
        </div>
        <!-- 離線提示 -->
        <div id="offline-badge" class="absolute top-12 right-6 hidden text-xs font-semibold bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full shadow">
            離線模式
        </div>
    </header>

    <!-- 剪貼插槽列表 -->
    <main class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-24" id="slot-container">
        <!-- 內容由 JS 動態渲染 -->
    </main>

    <!-- 主題懸浮按鈕 (FAB) -->
    <div class="fixed bottom-6 right-6 z-40 flex flex-col items-end">
        <!-- 展開的子選單 -->
        <div class="fab-menu flex flex-col items-end space-y-3 mb-4" id="fab-menu">
            <!-- 內容由 JS 動態渲染 -->
        </div>
        
        <!-- 主 FAB 按鈕 -->
        <button id="main-fab" class="w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-xl flex items-center justify-center text-2xl transition-transform active:scale-90 relative z-50">
            <!-- 由 JS 渲染當前圖示 -->
        </button>
    </div>

    <!-- 頂部提示框 (Toast) -->
    <div id="toast" class="toast fixed top-14 left-1/2 -translate-x-1/2 bg-gray-800 dark:bg-gray-700 text-white px-4 py-2 rounded-full shadow-lg z-50 flex items-center space-x-2 pointer-events-none">
        <span id="toast-icon">✅</span>
        <span id="toast-msg" class="text-sm font-medium">操作成功</span>
    </div>

    <script>
        /**
         * Ponytail 內審安全防護：
         * 1. 嚴格轉義 HTML 實體 (escapeHTML)，防禦使用者自訂名稱/內容時的 XSS 攻擊。
         * 2. Data-loss prevention：刪除主題前確認、防止刪除最後一個主題、刪除當前主題自動 Fallback。
         */
        
        // --- 狀態管理 ---
        let themesData = {}; 
        let clipboardData = {}; 
        let currentThemeId = null;
        let isEditMode = false;

        const DEFAULT_THEMES = {
            't_work': { icon: '💼', name: '工作' },
            't_personal': { icon: '🏠', name: '個人' },
            't_ideas': { icon: '💡', name: '靈感' }
        };

        // --- 安全工具 ---
        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        const generateId = () => 't_' + Date.now().toString();

        // --- 初始化與資料加載 ---
        function initData() {
            try {
                const storedThemes = localStorage.getItem('pwa_themes_data');
                const storedClips = localStorage.getItem('pwa_clipboard_data');
                
                themesData = storedThemes ? JSON.parse(storedThemes) : JSON.parse(JSON.stringify(DEFAULT_THEMES));
                clipboardData = storedClips ? JSON.parse(storedClips) : {};
            } catch (e) {
                console.error("讀取資料失敗", e);
                themesData = JSON.parse(JSON.stringify(DEFAULT_THEMES));
                clipboardData = {};
            }

            // 防呆：確保所有主題都有對應的陣列
            Object.keys(themesData).forEach(key => {
                if (!clipboardData[key] || !Array.isArray(clipboardData[key])) {
                    clipboardData[key] = Array(5).fill(''); // 預設 5 格
                }
            });

            // 防呆：若全部被誤刪，補回一個預設主題
            const themeKeys = Object.keys(themesData);
            if (themeKeys.length === 0) {
                themesData['t_default'] = { icon: '📝', name: '未命名' };
                clipboardData['t_default'] = Array(5).fill('');
                themeKeys.push('t_default');
            }

            currentThemeId = themeKeys[0]; // 預設選中第一個
        }

        function saveData() {
            localStorage.setItem('pwa_themes_data', JSON.stringify(themesData));
            localStorage.setItem('pwa_clipboard_data', JSON.stringify(clipboardData));
        }

        // --- 核心 UI 渲染 ---
        function renderAll() {
            renderHeader();
            renderSlots();
            renderFAB();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            // 退出編輯模式時確保關閉 FAB 選單
            if (!isEditMode) toggleFAB(false);
            renderAll();
        }

        function renderHeader() {
            const theme = themesData[currentThemeId];
            const titleContainer = document.getElementById('header-title-container');
            const actionsContainer = document.getElementById('header-actions');
            
            // 標題渲染 (編輯模式下可點擊改名)
            if (isEditMode) {
                titleContainer.innerHTML = `
                    <div class="flex items-center cursor-pointer active:scale-95 transition-transform" onclick="promptEditThemeName()">
                        <h1 class="text-2xl font-bold tracking-tight text-blue-600 truncate">
                            ${escapeHTML(theme.icon)} ${escapeHTML(theme.name)}
                        </h1>
                        <span class="ml-2 text-sm">✏️</span>
                    </div>
                    <p class="text-xs text-blue-500 mt-1">編輯模式：點擊文字修改，或刪除項目</p>
                `;
            } else {
                titleContainer.innerHTML = `
                    <h1 class="text-2xl font-bold tracking-tight truncate">${escapeHTML(theme.icon)} ${escapeHTML(theme.name)}</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">單擊複製 • 雙擊貼上</p>
                `;
            }

            // 動作按鈕渲染
            if (isEditMode) {
                const canDelete = Object.keys(themesData).length > 1;
                actionsContainer.innerHTML = `
                    ${canDelete ? `<button onclick="deleteCurrentTheme()" class="p-2 text-red-500 bg-red-50 dark:bg-red-900/30 rounded-full active:scale-90 transition-transform">🗑️</button>` : ''}
                    <button onclick="toggleEditMode()" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-full shadow-md active:scale-95 transition-transform text-sm">✅ 完成</button>
                `;
            } else {
                actionsContainer.innerHTML = `
                    <button onclick="toggleEditMode()" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold rounded-full shadow-sm active:scale-95 transition-transform text-sm flex items-center">
                        <span class="mr-1">⚙️</span> 管理
                    </button>
                `;
            }
        }

        function renderSlots() {
            const container = document.getElementById('slot-container');
            container.innerHTML = '';
            
            const slots = clipboardData[currentThemeId] || [];
            slots.forEach((text, index) => {
                const hasContent = text.trim().length > 0;
                
                const card = document.createElement('div');
                card.className = `slot-card bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 flex items-start space-x-3 relative overflow-hidden ${isEditMode ? '' : 'active:scale-98'}`;
                
                let contentHTML = '';
                if (isEditMode) {
                    // 編輯模式：點擊文字區塊進行編輯，右側顯示刪除鈕
                    const displayHTML = hasContent 
                        ? `<p class="text-sm text-gray-800 dark:text-gray-200 line-clamp-3 break-all">${escapeHTML(text)}</p>` 
                        : `<p class="text-sm text-gray-400 dark:text-gray-500 italic">空白插槽 (點擊編輯)</p>`;
                    
                    contentHTML = `
                        <div class="flex-shrink-0 w-8 h-8 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-full flex items-center justify-center font-bold text-sm">
                            ${index + 1}
                        </div>
                        <div class="flex-1 pt-1 cursor-pointer" onclick="promptEditSlot(${index})">
                            ${displayHTML}
                            <p class="text-[10px] text-blue-500 mt-1">✏️ 點擊修改</p>
                        </div>
                        <button onclick="deleteSlot(${index})" class="flex-shrink-0 p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-full active:scale-90 transition-transform">
                            🗑️
                        </button>
                    `;
                    card.innerHTML = contentHTML;
                } else {
                    // 正常模式：綁定單擊/雙擊
                    const displayHTML = hasContent 
                        ? `<p class="text-sm text-gray-800 dark:text-gray-200 line-clamp-3 break-all">${escapeHTML(text)}</p>` 
                        : `<p class="text-sm text-gray-400 dark:text-gray-500 italic">雙擊以貼上文字...</p>`;
                    
                    contentHTML = `
                        <div class="flex-shrink-0 w-8 h-8 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center font-bold text-sm">
                            ${index + 1}
                        </div>
                        <div class="flex-1 pt-1 pointer-events-none">
                            ${displayHTML}
                        </div>
                    `;
                    card.innerHTML = contentHTML;
                    attachTapEvents(card, index);
                }
                
                container.appendChild(card);
            });

            // 編輯模式底部：新增插槽按鈕
            if (isEditMode) {
                const addBtn = document.createElement('button');
                addBtn.onclick = addSlot;
                addBtn.className = "w-full py-4 mt-2 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl text-gray-500 dark:text-gray-400 font-medium active:scale-95 transition-transform flex items-center justify-center";
                addBtn.innerHTML = "➕ 新增插槽";
                container.appendChild(addBtn);
            }
        }

        function renderFAB() {
            const menu = document.getElementById('fab-menu');
            const mainFab = document.getElementById('main-fab');
            menu.innerHTML = '';
            
            // 更新主 FAB 圖示
            mainFab.innerText = themesData[currentThemeId] ? themesData[currentThemeId].icon : '📂';

            // 編輯模式下，選單頂部加入「新增主題」
            if (isEditMode) {
                menu.innerHTML += `
                    <button onclick="promptAddTheme()" class="flex items-center space-x-2 bg-blue-50 dark:bg-blue-900/30 p-3 rounded-full shadow-lg border border-blue-100 dark:border-blue-800 active:scale-95 transition-transform">
                        <span class="text-sm font-bold text-blue-600 dark:text-blue-400 pr-1 pl-1">➕ 新增主題</span>
                    </button>
                `;
            }

            // 渲染所有主題按鈕 (排除當前主題，保持畫面簡潔)
            Object.keys(themesData).forEach(key => {
                if (key !== currentThemeId) {
                    const t = themesData[key];
                    menu.innerHTML += `
                        <button onclick="switchTheme('${key}')" class="flex items-center space-x-2 bg-white dark:bg-gray-800 p-3 rounded-full shadow-lg border border-gray-100 dark:border-gray-700 active:scale-95 transition-transform">
                            <span class="text-sm font-medium pr-1">${escapeHTML(t.icon)} ${escapeHTML(t.name)}</span>
                        </button>
                    `;
                }
            });
        }

        // --- CRUD 操作 (管理模式) ---
        
        // [新增主題]
        function promptAddTheme() {
            toggleFAB(false);
            const name = prompt("請輸入新主題名稱 (例如：帳單)");
            if (!name || name.trim() === '') return;
            
            let icon = prompt("請輸入一個表情符號作為圖示 (例如：🧾)", "📂");
            if (!icon || icon.trim() === '') icon = "📂";

            const newId = generateId();
            themesData[newId] = { name: name.trim(), icon: icon.trim() };
            clipboardData[newId] = Array(5).fill(''); // 預設給 5 格
            
            saveData();
            currentThemeId = newId; // 切換到新主題
            renderAll();
            showToast('已新增主題', '✅');
        }

        // [編輯主題名稱]
        function promptEditThemeName() {
            const current = themesData[currentThemeId];
            const newName = prompt("修改主題名稱：", current.name);
            if (newName !== null && newName.trim() !== '') {
                current.name = newName.trim();
                
                const newIcon = prompt("修改主題圖示 (Emoji)：", current.icon);
                if (newIcon !== null && newIcon.trim() !== '') {
                    current.icon = newIcon.trim();
                }
                
                saveData();
                renderAll();
                showToast('已更新主題', '✅');
            }
        }

        // [刪除主題]
        function deleteCurrentTheme() {
            const keys = Object.keys(themesData);
            if (keys.length <= 1) {
                alert("至少需要保留一個主題！");
                return;
            }
            if (confirm(`確定要刪除「${themesData[currentThemeId].name}」以及其中的所有剪貼內容嗎？\n此操作無法復原。`)) {
                delete themesData[currentThemeId];
                delete clipboardData[currentThemeId];
                saveData();
                
                // Fallback 到清單中的第一個主題
                currentThemeId = Object.keys(themesData)[0];
                renderAll();
                showToast('已刪除主題', '🗑️');
            }
        }

        // [新增插槽]
        function addSlot() {
            clipboardData[currentThemeId].push('');
            saveData();
            renderSlots(); // 只需重繪插槽
            // 自動捲動到最底
            setTimeout(() => {
                const container = document.getElementById('slot-container');
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        // [編輯插槽內容]
        function promptEditSlot(index) {
            const currentText = clipboardData[currentThemeId][index];
            const newText = prompt("手動編輯插槽內容：", currentText);
            if (newText !== null) {
                clipboardData[currentThemeId][index] = newText.trim();
                saveData();
                renderSlots();
            }
        }

        // [刪除插槽]
        function deleteSlot(index) {
            if (confirm(`確定要移除此插槽 (第 ${index + 1} 格) 嗎？`)) {
                clipboardData[currentThemeId].splice(index, 1);
                saveData();
                renderSlots();
            }
        }

        // --- 互動邏輯 (正常模式：雙擊貼上/單擊複製) ---
        function switchTheme(themeKey) {
            currentThemeId = themeKey;
            toggleFAB(false);
            renderAll();
        }

        let lastTapTime = 0;
        let tapTimer = null;
        function attachTapEvents(element, index) {
            const handler = async (e) => {
                e.preventDefault(); 
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 350 && tapLength > 0) {
                    clearTimeout(tapTimer);
                    await handlePaste(element, index);
                } else {
                    tapTimer = setTimeout(() => {
                        handleCopy(element, index);
                    }, 350);
                }
                lastTapTime = currentTime;
            };

            element.addEventListener('touchend', handler);
            element.addEventListener('click', (e) => {
                if (e.pointerType === 'mouse') handler(e);
            });
        }

        async function handleCopy(element, index) {
            const text = clipboardData[currentThemeId][index];
            if (!text) {
                showToast('插槽為空，無法複製', '⚠️');
                return;
            }
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                }
                triggerFlash(element);
                showToast('已複製到剪貼簿!', '✅');
            } catch (err) {
                showToast('複製失敗', '❌');
            }
        }

        async function handlePaste(element, index) {
            try {
                if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error("不支援 API");
                const text = await navigator.clipboard.readText();
                if (text) {
                    clipboardData[currentThemeId][index] = text.trim();
                    saveData();
                    triggerFlash(element);
                    renderSlots();
                    showToast('已更新插槽!', '✅');
                } else {
                    showToast('剪貼簿為空', '⚠️');
                }
            } catch (err) {
                const fallbackText = prompt("系統阻擋自動讀取，請手動貼上於此：");
                if (fallbackText !== null && fallbackText.trim() !== "") {
                    clipboardData[currentThemeId][index] = fallbackText.trim();
                    saveData();
                    triggerFlash(element);
                    renderSlots();
                    showToast('已手動更新!', '✅');
                }
            }
        }

        // --- UI 輔助特效與 FAB ---
        function triggerFlash(element) {
            element.classList.remove('slot-flash');
            void element.offsetWidth;
            element.classList.add('slot-flash');
        }

        let toastTimeout;
        function showToast(msg, icon) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function toggleFAB(forceState) {
            const menu = document.getElementById('fab-menu');
            if (forceState !== undefined) {
                forceState ? menu.classList.add('active') : menu.classList.remove('active');
            } else {
                menu.classList.toggle('active');
            }
        }

        document.getElementById('main-fab').addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止冒泡觸發全局關閉
            toggleFAB();
        });

        // 點擊空白處關閉 FAB (且非編輯模式)
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.fixed.bottom-6')) toggleFAB(false);
        });
        document.addEventListener('touchend', (e) => {
             if (!e.target.closest('.fixed.bottom-6')) toggleFAB(false);
        });

        // --- PWA Service Worker (Blob 注入，免分離檔案) ---
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'clipboard-pwa-v2';
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            caches.match(e.request).then(response => {
                                return response || fetch(e.request).then(res => {
                                    if(e.request.url.startsWith(self.location.origin)) {
                                        const resClone = res.clone();
                                        caches.open(CACHE_NAME).then(cache => cache.put(e.request, resClone));
                                    }
                                    return res;
                                }).catch(() => new Response('Offline Content'));
                            })
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(err => console.error('SW 失敗', err));
            }
        }

        // 監聽連線狀態
        window.addEventListener('offline', () => document.getElementById('offline-badge').classList.remove('hidden'));
        window.addEventListener('online', () => document.getElementById('offline-badge').classList.add('hidden'));

        // --- 啟動 ---
        initData();
        renderAll();
        registerServiceWorker();
        if (!navigator.onLine) document.getElementById('offline-badge').classList.remove('hidden');

    </script>
</body>
</html>
