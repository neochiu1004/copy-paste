<!DOCTYPE html>
<html class="light" lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>ClipFlow - 極速剪貼 PWA</title>
    
    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ClipFlow">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="ClipFlow 極速剪貼：單擊複製、雙擊貼上、左滑刪除的本機剪貼插槽工具，資料只存在你的裝置上。">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Quicksand:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS (prebuilt; rebuild: npx tailwindcss -c tailwind.config.js -i src.css -o app.css --minify) -->
    <link rel="stylesheet" href="./app.css">
</head>
<body class="bg-surface text-on-surface font-body-md h-[100dvh] w-full flex flex-col overflow-hidden antialiased">

    <!-- 頂部導覽列 -->
    <header class="flex-none flex justify-between items-center px-4 py-3.5 w-full z-30 bg-surface-container-lowest shadow-sm pt-[max(env(safe-area-inset-top),0.85rem)] border-b border-surface-container-high relative">
        <div class="flex items-center gap-3 min-w-0 pr-2">
            <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center text-primary flex-shrink-0">
                <span class="material-symbols-outlined text-[24px] font-bold">content_paste</span>
            </div>
            <div class="flex flex-col min-w-0">
                <span class="text-xl font-bold text-primary font-headline-md leading-tight">ClipFlow</span>
                <span class="text-xs text-on-surface-variant/80 font-medium truncate">單擊複製 • 雙擊貼上 • 左滑刪除</span>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0">
            <!-- 離線提示 Badge -->
            <div id="offline-badge" class="hidden text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-full">
                離線模式
            </div>
            <button id="edit-mode-btn" onclick="toggleEditMode()" class="px-3.5 py-2 rounded-xl bg-surface-container-low text-on-surface-variant text-xs font-bold hover:bg-surface-container border border-outline-variant/40 transition-colors flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[18px]">tune</span>
                <span id="edit-mode-text">管理</span>
            </button>
        </div>
    </header>

    <!-- 橫向標籤列 (主題分類選擇區) -->
    <div class="flex-none w-full bg-surface-container-lowest border-b border-surface-container-high py-3 px-4 shadow-xs">
        <div id="group-tabs-container" class="flex overflow-x-auto hide-scrollbar gap-2.5 items-center">
            <!-- 標籤將透過 JS 動態注入 -->
        </div>
    </div>

    <!-- 主要內容滾動區 -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 relative bg-surface" id="main-scroll-area">
        
        <!-- 分類管理區塊 (僅在編輯模式下顯示) -->
        <div id="category-management-panel" class="hidden bg-surface-container-lowest p-4 rounded-2xl shadow-sm border border-surface-container-high mb-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold tracking-wider text-primary uppercase flex items-center gap-1">
                    <span class="material-symbols-outlined text-[18px]">reorder</span>
                    分類排序 (按住 ☰ 拖曳調整順序)
                </h3>
                <button onclick="actionAddTheme()" class="px-3.5 py-1.5 rounded-lg bg-primary-container text-on-primary-container text-xs font-bold hover:bg-primary-container/80 transition-colors flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">add</span> 新增分類
                </button>
            </div>
            <div id="theme-sort-list" class="space-y-2"></div>
            <div class="mt-4 pt-3 border-t border-surface-container">
                <h3 class="text-xs font-bold tracking-wider text-primary uppercase flex items-center gap-1 mb-2">
                    <span class="material-symbols-outlined text-[18px]">backup</span>
                    資料備份（只存本機，建議定期匯出）
                </h3>
                <div class="flex gap-2">
                    <button id="export-btn" class="px-3.5 py-1.5 rounded-lg bg-primary-container text-on-primary-container text-xs font-bold hover:bg-primary-container/80 transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">download</span> 匯出備份
                    </button>
                    <button id="import-btn" class="px-3.5 py-1.5 rounded-lg bg-surface-container-low text-on-surface-variant text-xs font-bold hover:bg-surface-container border border-outline-variant/40 transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-[16px]">upload</span> 匯入備份
                    </button>
                    <input type="file" id="import-file-input" accept="application/json,.json" class="hidden">
                </div>
            </div>
        </div>

        <!-- 剪貼卡片網格 -->
        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-28">
            <!-- 插槽卡片將透過 JS 動態注入 -->
        </div>
    </main>

    <!-- 主要懸浮按鈕 FAB (智能貼上至尾部空白格/新建) -->
    <button onclick="smartAddAction()" class="fixed bottom-6 right-6 w-14 h-14 bg-primary text-on-primary rounded-2xl ambient-shadow-high flex items-center justify-center hover:scale-105 active:scale-95 transition-transform z-40">
        <span class="material-symbols-outlined text-[30px]">add</span>
    </button>

    <!-- 通用現代視窗 Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="modal-box bg-surface-container-lowest rounded-3xl w-full max-w-sm shadow-2xl border border-surface-container p-6 flex flex-col gap-4">
            <h3 id="modal-title" class="text-xl font-bold text-on-surface font-headline-md">提示</h3>
            <p id="modal-message" class="text-base text-on-surface-variant leading-relaxed hidden whitespace-pre-wrap break-all"></p>
            
            <div id="modal-inputs" class="space-y-3 hidden">
                <input type="text" id="modal-input-1" class="w-full px-4 py-3 rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none text-base transition-colors" placeholder="輸入文字">
                <textarea id="modal-textarea" class="w-full px-4 py-3 rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none text-base transition-colors hidden min-h-[110px] resize-none" placeholder="輸入內容..."></textarea>
                <input type="text" id="modal-input-2" class="w-full px-4 py-3 rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none text-base transition-colors hidden" placeholder="輸入 Emoji">
                
                <div id="modal-image-upload" class="hidden flex flex-col items-center justify-center border-2 border-dashed border-outline-variant hover:border-primary rounded-2xl p-4 bg-surface transition-colors cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <span class="material-symbols-outlined text-primary text-3xl mb-1">add_photo_alternate</span>
                    <span class="text-xs font-bold text-on-surface-variant" id="image-upload-status">點擊選擇照片或更換圖片</span>
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </div>
            </div>

            <div id="modal-image-preview" class="hidden rounded-xl overflow-hidden border border-surface-container bg-surface max-h-48 flex justify-center items-center">
                <img id="modal-img-element" src="" class="max-h-48 object-contain w-full" alt="預覽">
            </div>
            
            <div class="flex justify-end gap-2.5 mt-2">
                <button id="modal-cancel" class="px-5 py-2.5 rounded-xl text-on-surface-variant font-bold hover:bg-surface-container active:scale-95 transition-all text-base">取消</button>
                <button id="modal-confirm" class="px-5 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-sm hover:bg-primary/90 active:scale-95 transition-all text-base">確定</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示訊息 -->
    <div id="toast" class="toast-animate fixed top-[env(safe-area-inset-top,20px)] mt-3 left-1/2 -translate-x-1/2 bg-on-surface text-surface px-5 py-2.5 rounded-full shadow-xl font-bold text-sm z-[110] hidden items-center gap-2 pointer-events-none">
        <span id="toast-icon" class="material-symbols-outlined text-[20px] text-primary-container">check_circle</span>
        <span id="toast-msg">操作成功</span>
    </div>

    <script>
        // ==========================================
        // 1. IndexedDB 核心存取 (圖片 Blob 儲存)
        // ==========================================
        const DB_NAME = 'ClipFlowDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'image_blobs';
        let dbInstance = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                if (dbInstance) return resolve(dbInstance);
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = (e) => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                req.onerror = (e) => reject('IndexedDB 初始化失敗: ' + e.target.error);
            });
        }

        async function saveImageBlob(id, blob) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(blob, id);
                req.onsuccess = () => resolve(id);
                req.onerror = () => reject('圖片儲存失敗');
            });
        }

        async function getImageBlob(id) {
            if (!id) return null;
            const db = await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        async function deleteImageBlob(id) {
            if (!id) return;
            const db = await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        // ==========================================
        // 2. 狀態管理與變數
        // ==========================================
        let themesData = {}; 
        let clipboardData = {}; 
        let themeOrder = [];
        let currentThemeId = null;
        let isEditMode = false;
        let tempPendingBlob = null;
        const imageUrlCache = new Map();

        const DEFAULT_THEMES = {
            't_work': { icon: '💼', name: '工作常用' },
            't_personal': { icon: '🏠', name: '個人日常' },
            't_ideas': { icon: '💡', name: '靈感筆記' }
        };

        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        const generateId = () => 't_' + Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6);

        function isValidURL(string) {
            if (!string || typeof string !== 'string') return false;
            const trimmed = string.trim();
            if (!trimmed.startsWith('http://') && !trimmed.startsWith('https://')) return false;
            try {
                new URL(trimmed);
                return true;
            } catch (_) {
                return false;
            }
        }

        // Modal 控制邏輯
        let modalCallback = null;
        const modalEl = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMsg = document.getElementById('modal-message');
        const modalInputs = document.getElementById('modal-inputs');
        const modalInput1 = document.getElementById('modal-input-1');
        const modalTextarea = document.getElementById('modal-textarea');
        const modalInput2 = document.getElementById('modal-input-2');
        const modalImageUpload = document.getElementById('modal-image-upload');
        const modalImagePreview = document.getElementById('modal-image-preview');
        const modalImgElement = document.getElementById('modal-img-element');
        const modalCancelBtn = document.getElementById('modal-cancel');
        const modalConfirmBtn = document.getElementById('modal-confirm');

        function openModal(options) {
            modalMsg.classList.add('hidden');
            modalInputs.classList.add('hidden');
            modalInput1.classList.add('hidden');
            modalTextarea.classList.add('hidden');
            modalInput2.classList.add('hidden');
            modalImageUpload.classList.add('hidden');
            modalImagePreview.classList.add('hidden');
            modalCancelBtn.classList.remove('hidden');
            
            modalInput1.value = '';
            modalTextarea.value = '';
            modalInput2.value = '';
            modalImgElement.src = '';
            tempPendingBlob = null;
            document.getElementById('image-upload-status').innerText = '點擊選擇照片或更換圖片';

            modalTitle.innerText = options.title || '提示';
            modalConfirmBtn.innerText = options.confirmText || '確定';
            
            if (options.message) {
                modalMsg.innerText = options.message;
                modalMsg.classList.remove('hidden');
            }
            if (options.currentImgUrl) {
                modalImagePreview.classList.remove('hidden');
                modalImgElement.src = options.currentImgUrl;
            }
            if (options.type === 'alert') {
                modalCancelBtn.classList.add('hidden');
            }
            if (options.type === 'slot-edit') {
                modalInputs.classList.remove('hidden');
                modalInput1.classList.remove('hidden');
                modalTextarea.classList.remove('hidden');
                modalImageUpload.classList.remove('hidden');

                modalInput1.placeholder = '自訂標題 (選填，例如：常用地址)';
                modalInput1.value = options.titleValue || '';
                modalTextarea.placeholder = '輸入文字內容或貼上網址...';
                modalTextarea.value = options.textValue || '';
            }
            if (options.type === 'double-prompt') {
                modalInputs.classList.remove('hidden');
                modalInput1.classList.remove('hidden');
                modalInput2.classList.remove('hidden');
                modalInput1.placeholder = options.placeholder1 || '請輸入...';
                modalInput1.value = options.value1 || '';
                modalInput2.placeholder = options.placeholder2 || '圖示 (Emoji)';
                modalInput2.value = options.value2 || '';
            }

            modalCallback = options.onConfirm;
            modalEl.classList.remove('hidden');
            modalEl.classList.add('flex');

            if (options.type === 'slot-edit') {
                setTimeout(() => modalTextarea.focus(), 100);
            } else if (options.type === 'double-prompt') {
                setTimeout(() => modalInput1.focus(), 100);
            }
        }

        function closeModal() {
            modalEl.classList.add('hidden');
            modalEl.classList.remove('flex');
            modalCallback = null;
            tempPendingBlob = null;
            renderSlots();
        }

        function handleFileSelect(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('請選擇圖片檔案', 'warning');
                return;
            }
            tempPendingBlob = file;
            const previewUrl = URL.createObjectURL(file);
            modalImgElement.src = previewUrl;
            modalImagePreview.classList.remove('hidden');
            document.getElementById('image-upload-status').innerText = `已選擇: ${file.name.substring(0, 15)}...`;
        }

        modalCancelBtn.onclick = () => closeModal();
        modalConfirmBtn.onclick = () => {
            if (modalCallback) {
                const val1 = modalInput1.value.trim();
                const textVal = modalTextarea.value.trim();
                const val2 = modalInput2.value.trim();
                modalCallback({ title: val1, text: textVal, val2: val2, pendingBlob: tempPendingBlob });
            }
            closeModal();
        };

        // ==========================================
        // 3. 資料初始化與自動補滿邏輯
        // ==========================================
        async function initData() {
            await initDB();
            try {
                const storedThemes = localStorage.getItem('pwa_themes_data');
                const storedClips = localStorage.getItem('pwa_clipboard_data');
                const storedOrder = localStorage.getItem('pwa_theme_order');
                
                themesData = storedThemes ? JSON.parse(storedThemes) : JSON.parse(JSON.stringify(DEFAULT_THEMES));
                clipboardData = storedClips ? JSON.parse(storedClips) : {};
                themeOrder = storedOrder ? JSON.parse(storedOrder) : [];
            } catch (e) {
                themesData = JSON.parse(JSON.stringify(DEFAULT_THEMES));
                clipboardData = {};
                themeOrder = [];
            }

            Object.keys(themesData).forEach(key => {
                if (!clipboardData[key] || !Array.isArray(clipboardData[key])) {
                    clipboardData[key] = Array.from({length: 4}, () => ({ title: '', text: '', type: 'text', imageId: null }));
                } else {
                    clipboardData[key] = clipboardData[key].map(item => {
                        if (typeof item === 'string') return { title: '', text: item, type: isValidURL(item) ? 'url' : 'text', imageId: null };
                        const obj = item || { title: '', text: '' };
                        if (!obj.type) {
                            obj.type = obj.imageId ? 'image' : (isValidURL(obj.text) ? 'url' : 'text');
                        }
                        return obj;
                    });
                }
                if (!themeOrder.includes(key)) {
                    themeOrder.push(key);
                }
            });

            themeOrder = themeOrder.filter(key => themesData[key]);

            if (themeOrder.length === 0) {
                themesData['t_default'] = { icon: '📝', name: '常用筆記' };
                clipboardData['t_default'] = Array.from({length: 4}, () => ({ title: '', text: '', type: 'text', imageId: null }));
                themeOrder = ['t_default'];
            }

            const lastTheme = localStorage.getItem('pwa_last_theme');
            if (lastTheme && themesData[lastTheme]) {
                currentThemeId = lastTheme;
            } else {
                currentThemeId = themeOrder[0];
            }

            ensureAutoEmptySlot(currentThemeId);
            renderAll();
        }

        // 自動生成機制：末尾非空時補上一格空白
        function ensureAutoEmptySlot(themeId) {
            const slots = clipboardData[themeId];
            if (!slots || slots.length === 0) {
                clipboardData[themeId] = [{ title: '', text: '', type: 'text', imageId: null }];
                return;
            }
            const last = slots[slots.length - 1];
            if ((last.text && last.text.trim()) || last.imageId || (last.title && last.title.trim())) {
                slots.push({ title: '', text: '', type: 'text', imageId: null });
            }
        }

        function saveData() {
            ensureAutoEmptySlot(currentThemeId);
            localStorage.setItem('pwa_themes_data', JSON.stringify(themesData));
            localStorage.setItem('pwa_clipboard_data', JSON.stringify(clipboardData));
            localStorage.setItem('pwa_theme_order', JSON.stringify(themeOrder));
            localStorage.setItem('pwa_last_theme', currentThemeId);
        }

        function renderAll() {
            renderHeaderAndTabs();
            renderSlots();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.getElementById('edit-mode-text').innerText = isEditMode ? '完成' : '管理';
            document.getElementById('category-management-panel').classList.toggle('hidden', !isEditMode);
            renderAll();
        }

        // ==========================================
        // 4. 介面渲染 (Tabs & Slot Grid)
        // ==========================================
        function renderHeaderAndTabs() {
            const tabsContainer = document.getElementById('group-tabs-container');
            tabsContainer.innerHTML = '';

            themeOrder.forEach(key => {
                const theme = themesData[key];
                const isActive = key === currentThemeId;

                const tabBtn = document.createElement('button');
                tabBtn.className = `flex-none px-4 py-2.5 rounded-full text-sm font-bold transition-all flex items-center gap-2 shadow-2xs border ${
                    isActive 
                        ? 'bg-primary text-on-primary border-primary ambient-shadow' 
                        : 'bg-surface-container-lowest text-on-surface-variant border-outline-variant/50 hover:bg-surface-container'
                }`;
                tabBtn.innerHTML = `
                    <span class="text-base">${escapeHTML(theme.icon)}</span>
                    <span>${escapeHTML(theme.name)}</span>
                `;
                tabBtn.onclick = () => switchTheme(key);
                tabsContainer.appendChild(tabBtn);
            });

            // 編輯模式下的分類排序列表
            if (isEditMode) {
                const sortList = document.getElementById('theme-sort-list');
                sortList.innerHTML = '';

                themeOrder.forEach((tId, idx) => {
                    const t = themesData[tId];
                    const isCurrent = tId === currentThemeId;
                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between p-3 rounded-xl border ${isCurrent ? 'border-primary bg-primary-container/30' : 'border-surface-container bg-surface-container-low'}`;
                    item.dataset.index = idx;
                    item.dataset.id = tId;
                    item.innerHTML = `
                        <div class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0" onclick="actionEditThemeName('${tId}')">
                            <span class="text-lg">${escapeHTML(t.icon)}</span>
                            <span class="text-sm font-bold truncate text-on-surface">${escapeHTML(t.name)}</span>
                            <span class="material-symbols-outlined text-[16px] text-primary">edit</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${themeOrder.length > 1 ? `<button onclick="actionDeleteTheme('${tId}')" class="p-1.5 text-error hover:bg-error/10 rounded-lg"><span class="material-symbols-outlined text-[20px]">delete</span></button>` : ''}
                            <div class="drag-handle p-1.5 cursor-grab active:cursor-grabbing text-outline-variant hover:text-on-surface select-none touch-none">
                                <span class="material-symbols-outlined text-[20px]">drag_indicator</span>
                            </div>
                        </div>
                    `;
                    attachDragEvents(item, idx);
                    sortList.appendChild(item);
                });
            }
        }

        async function renderSlots() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            ensureAutoEmptySlot(currentThemeId);
            const slots = clipboardData[currentThemeId] || [];

            for (let index = 0; index < slots.length; index++) {
                const item = slots[index];
                const hasTitle = item.title && item.title.trim().length > 0;
                const hasContent = item.text && item.text.trim().length > 0;
                const isUrl = item.type === 'url' || isValidURL(item.text);
                const isImage = item.type === 'image' || !!item.imageId;

                const card = document.createElement('div');
                card.className = `slot-card rounded-2xl border border-surface-container-high bg-surface-container-lowest p-4 ambient-shadow relative overflow-hidden flex flex-col justify-between min-h-[13.5rem] ${isEditMode ? '' : 'cursor-pointer hover:-translate-y-1 hover:ambient-shadow-high'}`;

                let bodyHTML = '';
                if (isImage) {
                    bodyHTML = `
                        <div class="flex-1 w-full relative rounded-xl overflow-hidden bg-surface-container my-1.5 border border-outline-variant/30 flex items-center justify-center min-h-[7.5rem]">
                            <img id="slot-img-${index}" data-image-id="${item.imageId ? item.imageId : ''}" src="" class="w-full h-full object-cover" alt="插槽圖片">
                            <div class="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2.5 py-1 rounded-full backdrop-blur-sm flex items-center gap-1 font-bold">
                                <span class="material-symbols-outlined text-[14px]">image</span> 圖片
                            </div>
                        </div>
                    `;
                } else if (isUrl) {
                    let domain = '';
                    try { domain = new URL(item.text.trim()).hostname; } catch(_) {}
                    bodyHTML = `
                        <div class="flex-1 my-1.5 p-3 rounded-xl bg-surface-container-low border border-secondary-container flex flex-col justify-center gap-1.5">
                            <div class="flex items-center gap-2 text-primary">
                                <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" onerror="this.style.display='none'" class="w-4 h-4 rounded-full" />
                                <span class="text-sm font-bold truncate">${escapeHTML(domain || '外部連結')}</span>
                            </div>
                            <p class="text-xs text-on-surface-variant truncate underline">${escapeHTML(item.text)}</p>
                        </div>
                    `;
                } else if (hasContent) {
                    bodyHTML = `
                        <div class="flex-1 my-1.5 overflow-hidden relative">
                            <p class="text-sm text-on-surface-variant leading-relaxed line-clamp-4 whitespace-pre-wrap">${escapeHTML(item.text)}</p>
                            <div class="absolute bottom-0 left-0 w-full h-4 bg-gradient-to-t from-surface-container-lowest to-transparent"></div>
                        </div>
                    `;
                } else {
                    bodyHTML = `
                        <div class="flex-1 my-1.5 rounded-xl border border-dashed border-outline-variant/60 flex flex-col items-center justify-center text-outline-variant min-h-[7rem]">
                            <span class="material-symbols-outlined text-3xl mb-1">add_circle_outline</span>
                            <p class="text-sm italic font-medium">空白插槽 (點擊編輯或雙擊貼上)</p>
                        </div>
                    `;
                }

                const titleHTML = hasTitle 
                    ? `<h4 class="font-bold text-base text-on-surface truncate">${escapeHTML(item.title)}</h4>` 
                    : `<h4 class="font-bold text-xs text-outline-variant/80 truncate">插槽 #${index + 1}</h4>`;

                if (isEditMode) {
                    card.innerHTML = `
                        <div class="flex justify-between items-center pb-1.5 border-b border-surface-container">
                            ${titleHTML}
                            <button onclick="actionDeleteSlot(${index})" aria-label="刪除" class="text-error p-1 hover:bg-error/10 rounded-lg">
                                <span class="material-symbols-outlined text-[20px]">delete</span>
                            </button>
                        </div>
                        ${bodyHTML}
                        <div class="pt-1.5 border-t border-surface-container flex justify-between items-center text-xs text-primary font-bold" onclick="actionEditSlot(${index})">
                            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">edit</span> 編輯卡片</span>
                            <span class="text-outline-variant font-normal">#${index + 1}</span>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex justify-between items-center pb-1.5 border-b border-surface-container pointer-events-none">
                            ${titleHTML}
                            <span class="text-xs font-bold text-primary bg-primary-container/50 px-2.5 py-0.5 rounded-md">#${index + 1}</span>
                        </div>
                        <div class="pointer-events-none flex-1 flex flex-col">${bodyHTML}</div>
                    `;
                    attachSlotInteractions(card, index);
                }

                container.appendChild(card);

                if (isImage && item.imageId) {
                    loadSlotImage(item.imageId, index);
                }
            }
        }

        async function loadSlotImage(imageId, index) {
            let srcUrl = imageUrlCache.get(imageId);
            if (!srcUrl) {
                const blob = await getImageBlob(imageId);
                if (blob) {
                    srcUrl = URL.createObjectURL(blob);
                    imageUrlCache.set(imageId, srcUrl);
                }
            }
            const imgEl = document.getElementById(`slot-img-${index}`);
            if (imgEl && srcUrl && imgEl.dataset.imageId === imageId) {
                imgEl.src = srcUrl;
            }
        }

        // ==========================================
        // 5. 插槽手勢 (左滑刪除、雙擊貼上、單擊複製)
        // ==========================================
        function attachSlotInteractions(element, index) {
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let isSwiping = false;
            let isScrolled = false;
            let lastTapTime = 0;
            let tapTimer = null;

            element.addEventListener('touchstart', (e) => {
                if (isEditMode) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                currentX = 0;
                isSwiping = false;
                isScrolled = false;
            }, { passive: true });

            element.addEventListener('touchmove', (e) => {
                if (isEditMode) return;
                const deltaX = e.touches[0].clientX - startX;
                const deltaY = e.touches[0].clientY - startY;

                if (Math.abs(deltaY) > Math.abs(deltaX) && !isSwiping) {
                    isScrolled = true;
                    return;
                }

                if (Math.abs(deltaX) > 10 && deltaX < 0) {
                    isSwiping = true;
                    currentX = deltaX;
                    element.classList.add('swiping');
                    element.style.transform = `translateX(${currentX}px)`;
                }
            }, { passive: true });

            element.addEventListener('touchend', (e) => {
                if (isEditMode) return;

                if (isSwiping) {
                    element.classList.remove('swiping');
                    if (currentX < -80) {
                        element.classList.add('swipe-removed');
                        setTimeout(() => actionDeleteSlot(index), 200);
                    } else {
                        element.style.transform = 'translateX(0px)';
                    }
                    return;
                }

                if (!isScrolled) {
                    lastTouchEndAt = Date.now();
                    e.preventDefault();
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;

                    if (tapLength < 350 && tapLength > 0) {
                        clearTimeout(tapTimer);
                        handlePaste(element, index);
                    } else {
                        tapTimer = setTimeout(() => {
                            handleCardClick(element, index);
                        }, 350);
                    }
                    lastTapTime = currentTime;
                }
            });

            element.addEventListener('click', (e) => {
                if (!isEditMode && Date.now() - lastTouchEndAt > 600) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;

                    if (tapLength < 350 && tapLength > 0) {
                        clearTimeout(tapTimer);
                        handlePaste(element, index);
                    } else {
                        tapTimer = setTimeout(() => {
                            handleCardClick(element, index);
                        }, 350);
                    }
                    lastTapTime = currentTime;
                }
            });
        }

        // 分類排序拖曳事件
        let lastTouchEndAt = 0;
        let draggedIdx = null;
        function attachDragEvents(element, index) {
            const handle = element.querySelector('.drag-handle');
            
            handle.addEventListener('pointerdown', (e) => {
                draggedIdx = index;
                element.classList.add('opacity-50');
                handle.setPointerCapture(e.pointerId);
            });

            handle.addEventListener('pointermove', (e) => {
                if (draggedIdx === null) return;
                const target = document.elementFromPoint(e.clientX, e.clientY);
                if (!target) return;
                const targetCard = target.closest('[data-index]');
                if (targetCard && targetCard !== element) {
                    const targetIdx = parseInt(targetCard.dataset.index, 10);
                    if (!isNaN(targetIdx) && targetIdx !== draggedIdx) {
                        const moved = themeOrder.splice(draggedIdx, 1)[0];
                        themeOrder.splice(targetIdx, 0, moved);
                        draggedIdx = targetIdx;
                        saveData();
                        renderSlots();
                        renderHeaderAndTabs();
                    }
                }
            });

            const endDrag = () => {
                if (draggedIdx !== null) {
                    draggedIdx = null;
                    element.classList.remove('opacity-50');
                    saveData();
                    renderAll();
                }
            };

            handle.addEventListener('pointerup', endDrag);
            handle.addEventListener('pointercancel', endDrag);
        }

        // ==========================================
        // 6. 剪貼簿邏輯 (複製/貼上/智能點擊)
        // ==========================================
        function switchTheme(themeKey) {
            if (!themesData[themeKey]) return;
            currentThemeId = themeKey;
            saveData();
            renderAll();
        }

        async function smartAddAction() {
            const slots = clipboardData[currentThemeId];
            let targetIdx = slots.findIndex(s => !s.text && !s.imageId);
            if (targetIdx === -1) targetIdx = slots.length - 1;

            const slotCard = document.querySelectorAll('.slot-card')[targetIdx];
            await handlePaste(slotCard, targetIdx);
        }

        async function handleCardClick(element, index) {
            const item = clipboardData[currentThemeId][index];
            const isUrl = item.type === 'url' || isValidURL(item.text);

            if (isUrl && item.text.trim()) {
                const targetUrl = item.text.trim();
                openModal({
                    type: 'confirm',
                    title: '🔗 前往外部連結',
                    message: `是否要開啟新分頁前往以下網址？\n\n${targetUrl}`,
                    confirmText: '開啟連結',
                    onConfirm: () => {
                        window.open(targetUrl, '_blank', 'noopener,noreferrer');
                    }
                });
                return;
            }

            if (item.type === 'image' && item.imageId) {
                const blob = await getImageBlob(item.imageId);
                if (blob && navigator.clipboard && window.ClipboardItem) {
                    try {
                        // Safari's clipboard only accepts image/png.
                        const pngBlob = blob.type === 'image/png' ? blob : await convertBlobToPng(blob);
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': pngBlob })
                        ]);
                        triggerFlash(element);
                        showToast('已複製圖片至剪貼簿!', 'image');
                        return;
                    } catch (err) {}
                }
                showToast('此瀏覽器不支援直接複製圖片', 'info');
                return;
            }

            handleCopyText(element, item.text);
        }

        async function handleCopyText(element, textToCopy) {
            if (!textToCopy) return showToast('插槽內容為空', 'warning');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                }
                triggerFlash(element);
                showToast('已複製!', 'check_circle');
            } catch (err) {
                showToast('複製失敗', 'error');
            }
        }

        async function handlePaste(element, index) {
            try {
                if (!navigator.clipboard) throw new Error("不支援 API");

                if (navigator.clipboard.read) {
                    const items = await navigator.clipboard.read();
                    for (const item of items) {
                        const imageType = item.types.find(type => type.startsWith('image/'));
                        if (imageType) {
                            const blob = await item.getType(imageType);
                            const previewUrl = URL.createObjectURL(blob);
                            openModal({
                                type: 'confirm',
                                title: `📋 貼上圖片至插槽 #${index + 1}`,
                                message: `偵測到剪貼簿中有圖片，是否確定貼上？`,
                                confirmText: '確定貼上',
                                currentImgUrl: previewUrl,
                                onConfirm: async () => {
                                    await processPastedImageBlob(element, index, blob);
                                }
                            });
                            return;
                        }
                    }
                }

                if (navigator.clipboard.readText) {
                    const pastedText = await navigator.clipboard.readText();
                    if (pastedText && pastedText.trim()) {
                        const previewText = pastedText.length > 80 ? pastedText.substring(0, 80) + '...' : pastedText;
                        openModal({
                            type: 'confirm',
                            title: `📋 貼上內容至插槽 #${index + 1}`,
                            message: `偵測到剪貼簿內容：\n\n「${previewText}」\n\n是否確定貼上？`,
                            confirmText: '確定貼上',
                            onConfirm: async () => {
                                await processPastedText(element, index, pastedText.trim());
                            }
                        });
                        return;
                    }
                }

                showToast('剪貼簿無可讀取內容', 'warning');
            } catch (err) {
                actionEditSlot(index);
            }
        }

        async function processPastedImageBlob(element, index, blob) {
            const item = clipboardData[currentThemeId][index];
            if (item.imageId) await deleteImageBlob(item.imageId);

            const newImgId = 'img_' + generateId();
            await saveImageBlob(newImgId, blob);

            item.imageId = newImgId;
            item.type = 'image';
            if (!item.title) item.title = '已貼上圖片';

            saveData();
            triggerFlash(element);
            renderSlots();
            showToast('已貼上圖片!', 'image');
        }

        async function processPastedText(element, index, text) {
            const item = clipboardData[currentThemeId][index];
            item.text = text;
            if (!item.imageId) {
                item.type = isValidURL(text) ? 'url' : 'text';
            }
            saveData();
            triggerFlash(element);
            renderSlots();
            showToast('已貼上內容!', 'check_circle');
        }

        // ==========================================
        // 7. 分類與插槽編輯動作
        // ==========================================
        function actionAddTheme() {
            openModal({
                type: 'double-prompt',
                title: '➕ 新增主題分類',
                placeholder1: '分類名稱 (例：旅行清單)',
                placeholder2: '圖示 Emoji (例：✈️)',
                onConfirm: ({ title, val2 }) => {
                    if (!title) return;
                    const finalIcon = val2 || '📂';
                    const newId = generateId();
                    themesData[newId] = { name: title, icon: finalIcon };
                    clipboardData[newId] = Array.from({length: 4}, () => ({ title: '', text: '', type: 'text', imageId: null }));
                    themeOrder.push(newId);
                    currentThemeId = newId;
                    saveData();
                    renderAll();
                    showToast('已新增分類', 'check_circle');
                }
            });
        }

        function actionEditThemeName(targetThemeId = currentThemeId) {
            const current = themesData[targetThemeId];
            openModal({
                type: 'double-prompt',
                title: '✏️ 修改分類設定',
                value1: current.name,
                placeholder1: '名稱',
                value2: current.icon,
                placeholder2: '圖示 Emoji',
                onConfirm: ({ title, val2 }) => {
                    if (!title) return;
                    current.name = title;
                    current.icon = val2 || current.icon;
                    saveData();
                    renderAll();
                    showToast('已更新分類', 'check_circle');
                }
            });
        }

        function actionDeleteTheme(targetThemeId = currentThemeId) {
            openModal({
                type: 'confirm',
                title: '🗑️ 刪除分類',
                message: `確定要刪除「${themesData[targetThemeId].name}」以及其中的所有內容嗎？`,
                confirmText: '確定刪除',
                onConfirm: async () => {
                    const slots = clipboardData[targetThemeId] || [];
                    for (const s of slots) {
                        if (s.imageId) await deleteImageBlob(s.imageId);
                    }
                    delete themesData[targetThemeId];
                    delete clipboardData[targetThemeId];
                    themeOrder = themeOrder.filter(id => id !== targetThemeId);
                    currentThemeId = themeOrder[0];
                    saveData();
                    renderAll();
                    showToast('已刪除分類', 'delete');
                }
            });
        }

        async function actionEditSlot(index) {
            const currentItem = clipboardData[currentThemeId][index];
            let currentImgUrl = '';
            if (currentItem.imageId) {
                currentImgUrl = imageUrlCache.get(currentItem.imageId);
                if (!currentImgUrl) {
                    const b = await getImageBlob(currentItem.imageId);
                    if (b) currentImgUrl = URL.createObjectURL(b);
                }
            }

            openModal({
                type: 'slot-edit',
                title: `✏️ 編輯插槽 #${index + 1}`,
                titleValue: currentItem.title || '',
                textValue: currentItem.text || '',
                currentImgUrl: currentImgUrl,
                onConfirm: async ({ title, text, pendingBlob }) => {
                    const item = clipboardData[currentThemeId][index];
                    item.title = title;

                    if (pendingBlob) {
                        if (item.imageId) await deleteImageBlob(item.imageId);
                        const newImgId = 'img_' + generateId();
                        await saveImageBlob(newImgId, pendingBlob);
                        item.imageId = newImgId;
                        item.type = 'image';
                        item.text = text || item.text;
                    } else if (text !== item.text) {
                        item.text = text;
                        if (!item.imageId) {
                            item.type = isValidURL(text) ? 'url' : 'text';
                        }
                    }

                    saveData();
                    renderSlots();
                    showToast('已儲存變更', 'check_circle');
                }
            });
        }

        function actionDeleteSlot(index) {
            openModal({
                type: 'confirm',
                title: '🗑️ 移除插槽',
                message: `確定要清除或移除第 ${index + 1} 個插槽嗎？`,
                confirmText: '確定移除',
                onConfirm: async () => {
                    const item = clipboardData[currentThemeId][index];
                    if (item && item.imageId) await deleteImageBlob(item.imageId);
                    clipboardData[currentThemeId].splice(index, 1);
                    saveData();
                    renderSlots();
                    showToast('已移除插槽', 'delete');
                }
            });
        }

        function triggerFlash(element) {
            if (!element) return;
            element.classList.remove('slot-flash');
            void element.offsetWidth;
            element.classList.add('slot-flash');
        }

        let toastTimeout;
        function showToast(msg, icon = 'check_circle') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2200);
        }

        async function convertBlobToPng(blob) {
            const bitmap = await createImageBitmap(blob);
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            canvas.getContext('2d').drawImage(bitmap, 0, 0);
            return new Promise((resolve, reject) => {
                canvas.toBlob((b) => b ? resolve(b) : reject(new Error('PNG 轉換失敗')), 'image/png');
            });
        }

        // ==========================================
        // 8. 備份匯出 / 匯入（JSON，圖片以 base64 一併打包）
        // ==========================================
        const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });

        const dataUrlToBlob = async (dataUrl) => (await fetch(dataUrl)).blob();

        async function exportBackup() {
            try {
                const imageIds = new Set();
                Object.values(clipboardData).forEach((slots) => {
                    (slots || []).forEach((slot) => { if (slot.imageId) imageIds.add(slot.imageId); });
                });
                const images = {};
                for (const id of imageIds) {
                    const blob = await getImageBlob(id);
                    if (blob) images[id] = await blobToDataUrl(blob);
                }
                const payload = {
                    app: 'ClipFlow',
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    themes: themesData,
                    clips: clipboardData,
                    order: themeOrder,
                    images,
                };
                const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `clipflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
                showToast('已匯出備份', 'download');
            } catch (err) {
                showToast('匯出失敗', 'error');
            }
        }

        async function importBackup(file) {
            try {
                const payload = JSON.parse(await file.text());
                if (payload.app !== 'ClipFlow' || !payload.themes || !payload.clips) {
                    throw new Error('格式不符');
                }
                openModal({
                    type: 'confirm',
                    title: '📥 匯入備份',
                    message: '匯入將覆蓋目前的全部資料，確定要繼續嗎？',
                    confirmText: '確定匯入',
                    onConfirm: async () => {
                        for (const [id, dataUrl] of Object.entries(payload.images || {})) {
                            await saveImageBlob(id, await dataUrlToBlob(dataUrl));
                        }
                        themesData = payload.themes;
                        clipboardData = payload.clips;
                        themeOrder = Array.isArray(payload.order) && payload.order.length
                            ? payload.order.filter((id) => themesData[id])
                            : Object.keys(themesData);
                        currentThemeId = themeOrder[0];
                        imageUrlCache.clear();
                        saveData();
                        renderAll();
                        showToast('已匯入備份', 'upload');
                    }
                });
            } catch (err) {
                showToast('匯入失敗：檔案格式不正確', 'error');
            }
        }

        // 監聽全域貼上事件
        document.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf('image') === 0) {
                    const blob = item.getAsFile();
                    if (blob) {
                        const slots = clipboardData[currentThemeId];
                        let targetIdx = slots.findIndex(s => !s.text && !s.imageId);
                        if (targetIdx === -1) targetIdx = 0;

                        const slotCard = document.querySelectorAll('.slot-card')[targetIdx];
                        const previewUrl = URL.createObjectURL(blob);
                        openModal({
                            type: 'confirm',
                            title: `📋 貼上圖片至插槽 #${targetIdx + 1}`,
                            message: `偵測到剪貼簿圖片，是否貼上？`,
                            confirmText: '確定貼上',
                            currentImgUrl: previewUrl,
                            onConfirm: async () => {
                                await processPastedImageBlob(slotCard, targetIdx, blob);
                            }
                        });
                        break;
                    }
                }
            }
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
        }

        window.addEventListener('offline', () => document.getElementById('offline-badge').classList.remove('hidden'));
        window.addEventListener('online', () => document.getElementById('offline-badge').classList.add('hidden'));

        document.getElementById('export-btn')?.addEventListener('click', exportBackup);
        document.getElementById('import-btn')?.addEventListener('click', () => document.getElementById('import-file-input')?.click());
        document.getElementById('import-file-input')?.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (file) importBackup(file);
            e.target.value = '';
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modalEl.classList.contains('hidden')) closeModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initData();
            registerServiceWorker();
            if (!navigator.onLine) document.getElementById('offline-badge').classList.remove('hidden');
        });
    </script>
</body>
</html>
