<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 強制禁止縮放，防止 iOS 雙擊與輸入框聚焦時畫面放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iOS PWA 專屬設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="極速剪貼">
    <title>極速剪貼 PWA</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏滾動條但保持可滾動 */
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; user-select: none; -webkit-user-select: none; }
        
        /* 點擊波紋與過場動畫 */
        .slot-card { transition: all 0.2s ease-in-out; }
        .slot-card:active { transform: scale(0.98); }
        .slot-flash { animation: flash-green 0.5s ease-out; }
        @keyframes flash-green {
            0% { background-color: rgba(34, 197, 94, 0.4); }
            100% { background-color: transparent; }
        }

        /* FAB 展開動畫 */
        .fab-menu { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; opacity: 0; transform: translateY(20px) scale(0.9); }
        .fab-menu.active { pointer-events: auto; opacity: 1; transform: translateY(0) scale(1); }
        
        /* Toast 動畫 */
        .toast { transition: all 0.3s ease; transform: translateY(-100%); opacity: 0; }
        .toast.show { transform: translateY(0); opacity: 1; }
        
        /* Modal 動畫 */
        #custom-modal.show { display: flex; animation: fadeIn 0.2s ease-out forwards; }
        #custom-modal .modal-box { transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #custom-modal.show .modal-box { transform: scale(1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 頂部導航列 -->
    <header class="pt-12 pb-4 px-6 bg-white dark:bg-gray-800 shadow-sm z-10 shrink-0 flex justify-between items-center relative">
        <div class="flex-1 min-w-0 pr-2" id="header-title-container"></div>
        <div class="flex items-center space-x-2 shrink-0" id="header-actions"></div>
        <div id="offline-badge" class="absolute top-12 right-6 hidden text-xs font-semibold bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full shadow">
            離線模式
        </div>
    </header>

    <!-- 剪貼插槽列表 -->
    <main class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-24" id="slot-container"></main>

    <!-- 主題懸浮按鈕 (FAB) -->
    <div class="fixed bottom-6 right-6 z-40 flex flex-col items-end">
        <div class="fab-menu flex flex-col items-end space-y-3 mb-4" id="fab-menu"></div>
        <button id="main-fab" class="w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-xl flex items-center justify-center text-2xl transition-transform active:scale-90 relative z-50">
        </button>
    </div>

    <!-- 頂部提示框 (Toast) -->
    <div id="toast" class="toast fixed top-14 left-1/2 -translate-x-1/2 bg-gray-800 dark:bg-gray-700 text-white px-4 py-2 rounded-full shadow-lg z-50 flex items-center space-x-2 pointer-events-none">
        <span id="toast-icon">✅</span>
        <span id="toast-msg" class="text-sm font-medium">操作成功</span>
    </div>

    <!-- 自建內嵌 Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="modal-box bg-white dark:bg-gray-800 w-10/12 max-w-sm rounded-3xl shadow-2xl p-6">
            <h3 id="modal-title" class="text-lg font-bold mb-2 dark:text-white">標題</h3>
            <p id="modal-message" class="text-sm text-gray-600 dark:text-gray-300 mb-4 hidden">訊息內容</p>
            
            <div id="modal-inputs" class="space-y-3 hidden mb-4">
                <input type="text" id="modal-input-1" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow" placeholder="輸入文字">
                <input type="text" id="modal-input-2" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-shadow hidden" placeholder="輸入 Emoji 圖示">
            </div>
            
            <div class="mt-2 flex justify-end space-x-3">
                <button id="modal-cancel" class="px-5 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 font-semibold hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-95 transition-all">取消</button>
                <button id="modal-confirm" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold shadow-md hover:bg-blue-700 active:scale-95 transition-all">確定</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Ponytail 內審安全防護：
         * 1. 資料結構由字串轉為 {title, text}。
         * 2. initData 加入 Migration 邏輯，自動把舊字串轉換為新物件，防呆防損毀。
         */
        
        let themesData = {}; 
        let clipboardData = {}; 
        let currentThemeId = null;
        let isEditMode = false;

        const DEFAULT_THEMES = {
            't_work': { icon: '💼', name: '工作' },
            't_personal': { icon: '🏠', name: '個人' },
            't_ideas': { icon: '💡', name: '靈感' }
        };

        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };
        const generateId = () => 't_' + Date.now().toString();

        // --- Modal 管理器 ---
        let modalCallback = null;
        const modalEl = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMsg = document.getElementById('modal-message');
        const modalInputs = document.getElementById('modal-inputs');
        const modalInput1 = document.getElementById('modal-input-1');
        const modalInput2 = document.getElementById('modal-input-2');
        const modalCancelBtn = document.getElementById('modal-cancel');
        const modalConfirmBtn = document.getElementById('modal-confirm');

        function openModal(options) {
            modalMsg.classList.add('hidden');
            modalInputs.classList.add('hidden');
            modalInput2.classList.add('hidden');
            modalCancelBtn.classList.remove('hidden');
            modalInput1.value = '';
            modalInput2.value = '';

            modalTitle.innerText = options.title || '提示';
            modalConfirmBtn.innerText = options.confirmText || '確定';
            
            if (options.message) {
                modalMsg.innerText = options.message;
                modalMsg.classList.remove('hidden');
            }
            if (options.type === 'alert') {
                modalCancelBtn.classList.add('hidden');
            }
            if (options.type === 'prompt' || options.type === 'double-prompt') {
                modalInputs.classList.remove('hidden');
                modalInput1.placeholder = options.placeholder1 || '請輸入...';
                modalInput1.value = options.value1 || '';
                
                if (options.type === 'double-prompt') {
                    modalInput2.classList.remove('hidden');
                    modalInput2.placeholder = options.placeholder2 || '選項 2';
                    modalInput2.value = options.value2 || '';
                }
            }

            modalCallback = options.onConfirm;
            modalEl.classList.add('show');
            modalEl.classList.remove('hidden');

            if (options.type.includes('prompt')) {
                setTimeout(() => modalInput1.focus(), 100);
            }
        }

        function closeModal() {
            modalEl.classList.remove('show');
            setTimeout(() => modalEl.classList.add('hidden'), 200);
            modalCallback = null;
        }

        modalCancelBtn.onclick = () => closeModal();
        modalConfirmBtn.onclick = () => {
            if (modalCallback) {
                const val1 = modalInput1.value.trim();
                const val2 = modalInput2.value.trim();
                modalCallback(val1, val2);
            }
            closeModal();
        };

        // --- 初始化與資料加載 (含向下相容轉移) ---
        function initData() {
            try {
                const storedThemes = localStorage.getItem('pwa_themes_data');
                const storedClips = localStorage.getItem('pwa_clipboard_data');
                themesData = storedThemes ? JSON.parse(storedThemes) : JSON.parse(JSON.stringify(DEFAULT_THEMES));
                clipboardData = storedClips ? JSON.parse(storedClips) : {};
            } catch (e) {
                themesData = JSON.parse(JSON.stringify(DEFAULT_THEMES));
                clipboardData = {};
            }

            // 確保插槽存在且升級為 {title, text} 物件結構
            Object.keys(themesData).forEach(key => {
                if (!clipboardData[key] || !Array.isArray(clipboardData[key])) {
                    clipboardData[key] = Array.from({length: 5}, () => ({ title: '', text: '' }));
                } else {
                    // 資料轉移 (Migration)：將舊版的純字串轉為新版物件
                    clipboardData[key] = clipboardData[key].map(item => {
                        if (typeof item === 'string') {
                            return { title: '', text: item };
                        }
                        return item || { title: '', text: '' };
                    });
                }
            });

            const themeKeys = Object.keys(themesData);
            if (themeKeys.length === 0) {
                themesData['t_default'] = { icon: '📝', name: '未命名' };
                clipboardData['t_default'] = Array.from({length: 5}, () => ({ title: '', text: '' }));
                themeKeys.push('t_default');
            }
            currentThemeId = themeKeys[0];
        }

        function saveData() {
            localStorage.setItem('pwa_themes_data', JSON.stringify(themesData));
            localStorage.setItem('pwa_clipboard_data', JSON.stringify(clipboardData));
        }

        // --- 核心 UI 渲染 ---
        function renderAll() {
            renderHeader();
            renderSlots();
            renderFAB();
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            if (!isEditMode) toggleFAB(false);
            renderAll();
        }

        function renderHeader() {
            const theme = themesData[currentThemeId];
            const titleContainer = document.getElementById('header-title-container');
            const actionsContainer = document.getElementById('header-actions');
            
            if (isEditMode) {
                titleContainer.innerHTML = `
                    <div class="flex items-center cursor-pointer active:scale-95 transition-transform" onclick="actionEditThemeName()">
                        <h1 class="text-2xl font-bold tracking-tight text-blue-600 truncate">
                            ${escapeHTML(theme.icon)} ${escapeHTML(theme.name)}
                        </h1>
                        <span class="ml-2 text-sm">✏️</span>
                    </div>
                `;
                const canDelete = Object.keys(themesData).length > 1;
                actionsContainer.innerHTML = `
                    <button onclick="actionAddTheme()" class="p-2 text-blue-600 bg-blue-50 dark:bg-blue-900/30 rounded-full active:scale-90 transition-transform flex items-center justify-center shadow-sm">➕</button>
                    ${canDelete ? `<button onclick="actionDeleteTheme()" class="p-2 text-red-500 bg-red-50 dark:bg-red-900/30 rounded-full active:scale-90 transition-transform shadow-sm">🗑️</button>` : ''}
                    <button onclick="toggleEditMode()" class="px-3 py-2 bg-blue-600 text-white font-semibold rounded-full shadow-md active:scale-95 transition-transform text-sm">完成</button>
                `;
            } else {
                titleContainer.innerHTML = `
                    <h1 class="text-2xl font-bold tracking-tight truncate">${escapeHTML(theme.icon)} ${escapeHTML(theme.name)}</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">單擊複製 • 雙擊貼上</p>
                `;
                actionsContainer.innerHTML = `
                    <button onclick="toggleEditMode()" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold rounded-full shadow-sm active:scale-95 transition-transform text-sm flex items-center">
                        <span class="mr-1">⚙️</span> 管理
                    </button>
                `;
            }
        }

        function renderSlots() {
            const container = document.getElementById('slot-container');
            container.innerHTML = '';
            
            const slots = clipboardData[currentThemeId] || [];
            slots.forEach((item, index) => {
                const hasTitle = item.title && item.title.trim().length > 0;
                const hasContent = item.text && item.text.trim().length > 0;
                
                const card = document.createElement('div');
                card.className = `slot-card bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 flex items-start space-x-3 relative overflow-hidden ${isEditMode ? '' : 'active:scale-98'}`;
                
                // 標題與內文渲染邏輯
                const titleHTML = hasTitle ? `<h4 class="font-bold text-sm text-gray-900 dark:text-gray-100 mb-0.5">${escapeHTML(item.title)}</h4>` : '';
                let textHTML = '';

                if (isEditMode) {
                    textHTML = hasContent 
                        ? `<p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2 break-all">${escapeHTML(item.text)}</p>` 
                        : `<p class="text-sm text-gray-400 dark:text-gray-500 italic">空白插槽 (點擊編輯)</p>`;
                    
                    card.innerHTML = `
                        <div class="flex-shrink-0 w-8 h-8 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-full flex items-center justify-center font-bold text-sm">${index + 1}</div>
                        <div class="flex-1 pt-0.5 cursor-pointer" onclick="actionEditSlot(${index})">
                            ${titleHTML}
                            ${textHTML}
                            <p class="text-[10px] text-blue-500 mt-1">✏️ 點擊修改標題與內容</p>
                        </div>
                        <button onclick="actionDeleteSlot(${index})" class="flex-shrink-0 p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-full active:scale-90 transition-transform">🗑️</button>
                    `;
                } else {
                    textHTML = hasContent 
                        ? `<p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2 break-all">${escapeHTML(item.text)}</p>` 
                        : `<p class="text-sm text-gray-400 dark:text-gray-500 italic">雙擊以貼上文字...</p>`;
                    
                    card.innerHTML = `
                        <div class="flex-shrink-0 w-8 h-8 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center font-bold text-sm">${index + 1}</div>
                        <div class="flex-1 pt-0.5 pointer-events-none">
                            ${titleHTML}
                            ${textHTML}
                        </div>
                    `;
                    attachTapEvents(card, index);
                }
                container.appendChild(card);
            });

            if (isEditMode) {
                const addBtn = document.createElement('button');
                addBtn.onclick = () => {
                    clipboardData[currentThemeId].push({ title: '', text: '' });
                    saveData(); renderSlots();
                    setTimeout(() => container.scrollTop = container.scrollHeight, 50);
                };
                addBtn.className = "w-full py-4 mt-2 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl text-gray-500 dark:text-gray-400 font-medium active:scale-95 transition-transform flex items-center justify-center";
                addBtn.innerHTML = "➕ 新增插槽";
                container.appendChild(addBtn);
            }
        }

        function renderFAB() {
            const menu = document.getElementById('fab-menu');
            const mainFab = document.getElementById('main-fab');
            menu.innerHTML = '';
            
            mainFab.innerText = themesData[currentThemeId] ? themesData[currentThemeId].icon : '📂';
            mainFab.style.display = isEditMode ? 'none' : 'flex';

            Object.keys(themesData).forEach(key => {
                if (key !== currentThemeId) {
                    const t = themesData[key];
                    menu.innerHTML += `
                        <button onclick="switchTheme('${key}')" class="flex items-center space-x-2 bg-white dark:bg-gray-800 p-3 rounded-full shadow-lg border border-gray-100 dark:border-gray-700 active:scale-95 transition-transform">
                            <span class="text-sm font-medium pr-1">${escapeHTML(t.icon)} ${escapeHTML(t.name)}</span>
                        </button>
                    `;
                }
            });
        }

        // --- CRUD 操作 (基於自建 Modal) ---
        
        function actionAddTheme() {
            openModal({
                type: 'double-prompt',
                title: '➕ 新增主題',
                placeholder1: '名稱 (例：購物)',
                placeholder2: '圖示 (Emoji)',
                onConfirm: (name, icon) => {
                    if (!name) return;
                    const finalIcon = icon || '📂';
                    const newId = generateId();
                    themesData[newId] = { name: name, icon: finalIcon };
                    clipboardData[newId] = Array.from({length: 5}, () => ({ title: '', text: '' }));
                    saveData();
                    currentThemeId = newId;
                    renderAll();
                    showToast('已新增主題', '✅');
                }
            });
        }

        function actionEditThemeName() {
            const current = themesData[currentThemeId];
            openModal({
                type: 'double-prompt',
                title: '✏️ 修改主題',
                value1: current.name,
                placeholder1: '名稱',
                value2: current.icon,
                placeholder2: '圖示 (Emoji)',
                onConfirm: (name, icon) => {
                    if (!name) return;
                    current.name = name;
                    current.icon = icon || current.icon;
                    saveData();
                    renderAll();
                    showToast('已更新主題', '✅');
                }
            });
        }

        function actionDeleteTheme() {
            openModal({
                type: 'confirm',
                title: '🗑️ 刪除主題',
                message: `確定要刪除「${themesData[currentThemeId].name}」及內部所有文字嗎？此操作無法復原。`,
                confirmText: '確定刪除',
                onConfirm: () => {
                    delete themesData[currentThemeId];
                    delete clipboardData[currentThemeId];
                    saveData();
                    currentThemeId = Object.keys(themesData)[0];
                    renderAll();
                    showToast('已刪除', '🗑️');
                }
            });
        }

        function actionEditSlot(index) {
            const currentItem = clipboardData[currentThemeId][index];
            openModal({
                type: 'double-prompt',
                title: '✏️ 編輯插槽內容',
                placeholder1: '自訂標題 (選填，如：銀行帳號)',
                value1: currentItem.title || '',
                placeholder2: '輸入文字內容 (必填)',
                value2: currentItem.text || '',
                onConfirm: (title, text) => {
                    clipboardData[currentThemeId][index].title = title;
                    clipboardData[currentThemeId][index].text = text;
                    saveData();
                    renderSlots();
                }
            });
        }

        function actionDeleteSlot(index) {
            openModal({
                type: 'confirm',
                title: '🗑️ 移除插槽',
                message: `確定要移除此插槽 (第 ${index + 1} 格) 嗎？`,
                confirmText: '移除',
                onConfirm: () => {
                    clipboardData[currentThemeId].splice(index, 1);
                    saveData();
                    renderSlots();
                }
            });
        }

        // --- 互動邏輯 (正常模式：雙擊貼上/單擊複製) ---
        function switchTheme(themeKey) {
            currentThemeId = themeKey;
            toggleFAB(false);
            renderAll();
        }

        let lastTapTime = 0;
        let tapTimer = null;
        function attachTapEvents(element, index) {
            const handler = async (e) => {
                e.preventDefault(); 
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < 350 && tapLength > 0) {
                    clearTimeout(tapTimer);
                    await handlePaste(element, index);
                } else {
                    tapTimer = setTimeout(() => handleCopy(element, index), 350);
                }
                lastTapTime = currentTime;
            };
            element.addEventListener('touchend', handler);
            element.addEventListener('click', (e) => {
                if (e.pointerType === 'mouse') handler(e);
            });
        }

        async function handleCopy(element, index) {
            const textToCopy = clipboardData[currentThemeId][index].text;
            if (!textToCopy) return showToast('內容為空', '⚠️');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                }
                triggerFlash(element);
                showToast('已複製!', '✅');
            } catch (err) {
                showToast('複製失敗', '❌');
            }
        }

        async function handlePaste(element, index) {
            try {
                if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error("不支援 API");
                const pastedText = await navigator.clipboard.readText();
                if (pastedText) {
                    clipboardData[currentThemeId][index].text = pastedText.trim();
                    saveData(); triggerFlash(element); renderSlots(); showToast('已更新!', '✅');
                } else {
                    showToast('剪貼簿為空', '⚠️');
                }
            } catch (err) {
                // 如果自動貼上被擋，退化為 Modal 手動輸入 (僅更新內文)
                openModal({
                    type: 'prompt',
                    title: '📋 手動貼上',
                    message: '系統阻擋自動讀取，請在此長按手動貼上：',
                    onConfirm: (pastedText) => {
                        if (pastedText) {
                            clipboardData[currentThemeId][index].text = pastedText.trim();
                            saveData(); triggerFlash(element); renderSlots(); showToast('已更新!', '✅');
                        }
                    }
                });
            }
        }

        // --- UI 輔助特效 ---
        function triggerFlash(element) {
            element.classList.remove('slot-flash');
            void element.offsetWidth;
            element.classList.add('slot-flash');
        }

        let toastTimeout;
        function showToast(msg, icon) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function toggleFAB(forceState) {
            const menu = document.getElementById('fab-menu');
            if (forceState !== undefined) {
                forceState ? menu.classList.add('active') : menu.classList.remove('active');
            } else {
                menu.classList.toggle('active');
            }
        }

        document.getElementById('main-fab').addEventListener('click', (e) => {
            e.stopPropagation(); 
            toggleFAB();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.fixed.bottom-6') && !isEditMode) toggleFAB(false);
        });
        document.addEventListener('touchend', (e) => {
             if (!e.target.closest('.fixed.bottom-6') && !isEditMode) toggleFAB(false);
        });

        // --- PWA Service Worker (修正 Blob 問題) ---
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                // 為了避免在預覽環境及嚴格安全性下 Blob URL 報錯，
                // 改為標準的 sw.js 註冊方式，並靜默處理找不到檔案的錯誤。
                // 若您部署至 GitHub Pages，應用程式依然可依賴 Safari 預設快取運作。
                navigator.serviceWorker.register('./sw.js').catch(e => {
                    console.log('以無 ServiceWorker 模式運行 (正常現象，不影響主要功能)');
                });
            }
        }

        window.addEventListener('offline', () => document.getElementById('offline-badge').classList.remove('hidden'));
        window.addEventListener('online', () => document.getElementById('offline-badge').classList.add('hidden'));

        // --- 啟動 ---
        initData();
        renderAll();
        registerServiceWorker();
        if (!navigator.onLine) document.getElementById('offline-badge').classList.remove('hidden');

    </script>
</body>
</html>
